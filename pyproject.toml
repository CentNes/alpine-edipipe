[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alpine-edipipe"
version = "0.1.0"
description = "Shared X12 EDI engine (reader + writer) for the Alpine / First Medical MMIS platform"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[tool.setuptools]
packages = ["edipipe", "edipipe.core", "edipipe.read", "edipipe.write"]

[tool.pytest.ini_options]
testpaths = ["tests"]
